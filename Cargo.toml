[package]
name = "ai-operator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
bytes = { version = "1.10.1", features = ["serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
log = "0.4.28"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
simplelog = "0.12.2"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
websocket = "0.27.1"
