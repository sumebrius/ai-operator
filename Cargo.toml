[package]
name = "ai-operator"
version = "0.3.2"
edition = "2024"

[dependencies]
# Webhook listener API
axum = { version = "0.8.6", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
bytes = "1.10.1"
# Just for reading the contact list
csv = "1.4.0"
# Provides a trait for easy looping async websocket events
futures-util = { version = "0.3.31", default-features = false, features = [
    "sink",
    "std",
] }
# I just want to spit out some status codes
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", default-features = false, features = [
    "client",
    "http1",
] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
# Have a guess...
serde = { version = "1.0.228", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
# Webhook validation
standardwebhooks = "1.0.1"
# Have a guess...
tokio = { version = "1.48.0", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
] }
# REST API interactions share the same Rustls stack as the websocket client.
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
# Websocket API interactions
tokio-tungstenite = { version = "0.28.0", features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
], default-features = false }
# Logging
tracing = { version = "0.1.41", default-features = false, features = [
    "attributes",
    "std",
] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "fmt",
    "std",
] }
webpki-roots = "0.26.11"

[profile.release]
strip = "symbols"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
