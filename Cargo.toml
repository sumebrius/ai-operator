[package]
name = "ai-operator"
version = "0.1.0"
edition = "2024"

[dependencies]
# Webhook listener API
axum = "0.8.6"
# Storing the prompt as bytes, it's chonky and gets passed around a lot
bytes = { version = "1.10.1", features = ["serde"] }
# Serdeing timestamps and timestamping logfiles
chrono = { version = "0.4.42", features = ["serde"] }
# Just for reading the contact list
csv = "1.4.0"
# Provides a trait for easy looping async websocket events
futures-util = "0.3.31"
# I just want to spit out some status codes
http = "1.3.1"
# reqwest and tokio_tungstenite both use rustls as openssl
# is fucky in trixie-slim images so native-tls don't work.
# REST API interactions
reqwest = { version = "0.12.24", features = [
    "json",
    "rustls-tls",
    # Defaults except native-tls
    "charset",
    "http2",
    "system-proxy",
], default-features = false }
# Generating JSON schemas for tool calls
schemars = "1.1.0"
# Have a guess...
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Webhook validation
standardwebhooks = "1.0.1"
# Have a guess...
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
# Websocket API interactions
tokio-tungstenite = { version = "0.28.0", features = [
    "tokio-rustls",
    "rustls-tls-webpki-roots",
] }
# Logging the axum stack
tower-http = { version = "0.6.6", features = ["trace"] }
# Logging
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
